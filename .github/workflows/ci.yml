name: CI

on:
  push:
    branches: [ develop, main, 'feature/**' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: github_actions
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Composer install
        run: |
          composer install --no-progress --no-suggest --prefer-dist --no-interaction

      - name: Generate APP_KEY
        run: php artisan key:generate --ansi

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do mysql -h127.0.0.1 -uroot -ppassword -e "select 1" && break || sleep 1; done

      - name: Create database & run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: github_actions
          DB_USERNAME: root
          DB_PASSWORD: password
          APP_ENV: testing
        run: |
          php artisan migrate --force

      - name: Run PHP tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: github_actions
          DB_USERNAME: root
          DB_PASSWORD: password
          APP_ENV: testing
        run: php artisan test --verbose

      - name: Install Node packages
        run: |
          npm ci

      - name: Build frontend
        run: npm run build --if-present
